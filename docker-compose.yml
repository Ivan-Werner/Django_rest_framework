version: '3.12'

services:
  web:
    build: .
    command: >
      bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    volumes:
      - .:/code
      - static_volume:/code/static
    ports:
      - "8000:8000"
    depends_on:
      - db


  db:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5433:5433"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6
    ports:
      - "6379:6379"
    env_file:
      - ./.env

  celery:
    build: .
    command: >
      bash -c "celery -A config worker --loglevel=info --pool=gevent"
    env_file:
      - .env
    depends_on:
      - redis
      - db

  celery-beat:
    build: .
    env_file:
      - .env
    command: >
      bash -c "celery -A config beat --loglevel=info"
    depends_on:
      - redis
      - db


volumes:
  postgres_data:
  static_volume:
